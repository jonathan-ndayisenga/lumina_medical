{% extends "books/base.html" %}
{% block title %}New Financial Year - Ternah Books{% endblock %}
{% block content %}
<h1 class="page-title">New financial year</h1>
<div class="card" style="max-width:500px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div style="margin-bottom:1rem;">
            <label style="display:block;font-size:0.85rem;font-weight:600;margin-bottom:0.3rem;">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<p style="color:#a12b2b;font-size:0.8rem;">{{ error }}</p>{% endfor %}
        </div>
        {% endfor %}
        <button type="submit" class="btn">Save</button>
        <a href="{% url 'books:financial_year_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
