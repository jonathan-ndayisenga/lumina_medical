{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline · Ternah</title>
<meta name="theme-color" content="#14233A">
<style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: #F4F3EF; color: #15202E; font-family: 'Hanken Grotesk', system-ui, sans-serif; }
    .card { max-width: 380px; text-align: center; background: #fff; border: 1px solid #E4E2DB; border-radius: 20px; padding: 32px 24px; }
    img { width: 56px; height: 56px; border-radius: 14px; }
    h1 { margin: 16px 0 6px; font-size: 22px; font-weight: 600; }
    p { margin: 0; color: #5B6472; font-size: 15px; line-height: 1.5; }
    button { margin-top: 20px; height: 44px; padding: 0 20px; border-radius: 12px; border: 0; background: #14233A; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 2px solid #15202E; outline-offset: 2px; }
</style>
</head>
<body>
<div class="card">
    <img src="{% static 'pwa/icon-192.png' %}" alt="Ternah">
    <h1>You're offline</h1>
    <p>Ternah needs an internet connection to load patient records. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
</div>
</body>
</html>
