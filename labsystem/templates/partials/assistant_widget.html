{% load static %}
<div class="ta" data-assistant data-url="{{ assistant_url }}" data-csrf="{{ csrf_token }}">
    <button type="button" class="ta-fab" aria-label="Ask Ternah Assistant" aria-expanded="false" aria-controls="ta-panel">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12Z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>
    </button>
    <section class="ta-panel" id="ta-panel" role="dialog" aria-label="Ternah Assistant" hidden>
        <header class="ta-head">
            <img src="{% static 'images/ternah_logo_white.svg' %}" alt="">
            <div><strong>Ternah Assistant</strong><span>Answers from your own records</span></div>
            <button type="button" class="ta-close" aria-label="Close assistant">&times;</button>
        </header>
        <div class="ta-log" aria-live="polite"></div>
        <form class="ta-form">
            <input type="text" name="q" maxlength="300" autocomplete="off" placeholder="Ask a question…" aria-label="Your question">
            <button type="submit" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </form>
    </section>
</div>
<style>
    .ta { --ta-nav: #14233A; --ta-ink: #15202E; --ta-muted: #5B6472; --ta-border: #E4E2DB; --ta-bg: #F4F3EF; font-family: 'Hanken Grotesk', -apple-system, 'Segoe UI', sans-serif; }
    .ta-fab { position: fixed; right: 20px; bottom: 20px; z-index: 35; width: 56px; height: 56px; border: 0; border-radius: 50%; background: var(--ta-nav); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 24px rgba(20, 35, 58, 0.35); }
    .ta-fab:focus-visible, .ta-close:focus-visible, .ta-form button:focus-visible { outline: 3px solid #8fb3ff; outline-offset: 2px; }
    /* Sits under menus and their blurred backdrop, and leaves room so it never covers the last row of a page. */
    /* On the content, not the body: body padding sits below the whole layout and leaves a gap under the sidebar. */
    main, main.main { padding-bottom: 84px; }
    body.nav-open .ta-fab { visibility: hidden; }
    .ta-panel { position: fixed; right: 20px; bottom: 88px; z-index: 61; width: 380px; max-width: calc(100vw - 32px); height: min(560px, calc(100dvh - 120px)); display: flex; flex-direction: column; background: #fff; border: 1px solid var(--ta-border); border-radius: 16px; overflow: hidden; box-shadow: 0 18px 50px rgba(20, 35, 58, 0.28); color: var(--ta-ink); }
    .ta-panel[hidden] { display: none; }
    .ta-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--ta-nav); color: #fff; }
    .ta-head img { height: 22px; width: auto; }
    .ta-head div { display: flex; flex-direction: column; line-height: 1.2; }
    .ta-head span { font-size: 12px; color: #C9D2DE; }
    .ta-close { margin-left: auto; width: 36px; height: 36px; border: 0; border-radius: 8px; background: none; color: #fff; font-size: 24px; cursor: pointer; }
    .ta-log { flex: 1; overflow-y: auto; padding: 14px; background: var(--ta-bg); display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
    .ta-msg { max-width: 92%; padding: 10px 12px; border-radius: 12px; line-height: 1.45; }
    .ta-me { align-self: flex-end; background: var(--ta-nav); color: #fff; border-bottom-right-radius: 4px; }
    .ta-bot { align-self: flex-start; background: #fff; border: 1px solid var(--ta-border); border-bottom-left-radius: 4px; }
    .ta-bot p { margin: 0; }
    .ta-understood { display: block; margin-bottom: 4px; font-size: 11px; letter-spacing: 0.02em; color: var(--ta-muted); }
    .ta-facts { width: 100%; margin-top: 8px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .ta-facts td { padding: 4px 0; border-top: 1px solid var(--ta-border); font-size: 13px; vertical-align: top; }
    .ta-facts td:last-child { padding-left: 10px; text-align: right; font-weight: 600; white-space: nowrap; }
    .ta-link { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 600; color: #2f4cff; }
    .ta-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .ta-chips button { padding: 6px 10px; border: 1px solid var(--ta-border); border-radius: 999px; background: #fff; color: var(--ta-ink); font: inherit; font-size: 12.5px; cursor: pointer; }
    .ta-chips button:hover { border-color: var(--ta-nav); }
    .ta-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--ta-border); background: #fff; }
    .ta-form input { flex: 1; min-width: 0; height: 44px; padding: 0 12px; border: 1px solid var(--ta-border); border-radius: 10px; font: inherit; font-size: 16px; color: var(--ta-ink); }
    .ta-form input:focus { outline: none; border-color: var(--ta-nav); box-shadow: 0 0 0 3px rgba(20, 35, 58, 0.12); }
    .ta-form button { width: 44px; height: 44px; border: 0; border-radius: 10px; background: var(--ta-nav); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .ta-typing { color: var(--ta-muted); font-style: italic; }
    @media (max-width: 760px) {
        .ta-fab { right: 16px; bottom: 16px; }
        .ta-panel { right: 0; left: 0; bottom: 0; width: 100%; max-width: none; height: 85dvh; border-radius: 16px 16px 0 0; }
    }
    @media print { .ta { display: none; } }
</style>
<script src="{% static 'js/assistant.js' %}" defer></script>
